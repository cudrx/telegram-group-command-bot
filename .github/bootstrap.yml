apiVersion: v1
kind: Namespace
metadata:
  name: telegram-bot
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bot-data
  namespace: telegram-bot
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deploy
  namespace: telegram-bot
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deploy
  namespace: telegram-bot
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [telegram-bot]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, create, patch, update]
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deploy
  namespace: telegram-bot
subjects:
  - kind: ServiceAccount
    name: github-deploy
    namespace: telegram-bot
roleRef:
  kind: Role
  name: github-deploy
  apiGroup: rbac.authorization.k8s.io
