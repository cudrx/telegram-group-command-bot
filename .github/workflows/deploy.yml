name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      publish: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      BOT_IMAGE: ${{ needs.build.outputs.bot-image }}
      VIDEO_IMAGE: ${{ needs.build.outputs.video-image }}
      GALLERY_IMAGE: ${{ needs.build.outputs.gallery-image }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER || 'github-deploy' }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/srv/telegram-bot' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate deploy metadata
        run: node --experimental-strip-types scripts/generate-deploy-metadata.ts
        env:
          DEPLOY_METADATA_BEFORE_SHA: ${{ github.event.before || '' }}
          DEPLOY_METADATA_SHA: ${{ github.sha }}
          DEPLOY_METADATA_BRANCH: ${{ github.ref_name }}
          DEPLOY_METADATA_OUTPUT: .github/generated/deploy-metadata.json

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_HOST"
          [[ "$DEPLOY_DIR" =~ ^/[a-zA-Z0-9/_-]+$ && "$DEPLOY_DIR" != / ]]
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Deploy
        run: |
          set -euo pipefail
          printf 'BOT_IMAGE=%s\nVIDEO_IMAGE=%s\nGALLERY_IMAGE=%s\n' \
            "$BOT_IMAGE" "$VIDEO_IMAGE" "$GALLERY_IMAGE" > .github/generated/images.env
          target="$SSH_USER@$SSH_HOST"
          options=(-oBatchMode=yes -oStrictHostKeyChecking=yes -oConnectTimeout=15)
          # shellcheck disable=SC2029
          ssh "${options[@]}" "$target" "mkdir -p '$DEPLOY_DIR/deploy'"
          scp "${options[@]}" \
            compose.yml .github/deploy.sh .github/generated/images.env "$target:$DEPLOY_DIR/"
          scp "${options[@]}" \
            .github/generated/deploy-metadata.json "$target:$DEPLOY_DIR/deploy/"
          # shellcheck disable=SC2029
          ssh "${options[@]}" "$target" "cd '$DEPLOY_DIR' && bash deploy.sh"

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
