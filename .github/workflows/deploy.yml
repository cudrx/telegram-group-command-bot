name: Deploy

# on:
#   workflow_dispatch:
#   push:
#     branches: [main]
#     paths-ignore: ['docs/**', 'README.md']

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      publish: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      BOT_IMAGE: ${{ needs.build.outputs.bot-image }}
      VIDEO_IMAGE: ${{ needs.build.outputs.video-image }}
      GALLERY_IMAGE: ${{ needs.build.outputs.gallery-image }}
      IMAGE_TAG: ${{ github.sha }}
      KUBECONFIG: ${{ github.workspace }}/.kubeconfig
      DEPLOY_METADATA_FILE: .github/generated/deploy-metadata.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ vars.KUBECTL_VERSION || 'v1.36.0' }}

      - name: Configure cluster credentials
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KUBE_CONFIG"
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"

      - name: Configure SSH tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/k3s-deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/k3s-deploy"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -f -N \
            -i "$HOME/.ssh/k3s-deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=15 \
            -L 127.0.0.1:16443:127.0.0.1:6443 \
            github-deploy@185.21.10.93

          echo "SSH tunnel established"

          kubectl --request-timeout=15s auth whoami

          kubectl --request-timeout=15s \
            auth can-i patch deployment/telegram-bot \
            -n telegram-bot | grep -qx yes

      - name: Read deployed commit
        id: deployed
        run: |
          sha="$(kubectl -n telegram-bot get deployment telegram-bot --ignore-not-found -o jsonpath='{.spec.template.metadata.annotations.telegram-bot/commit}')"
          if [[ -n "$sha" ]]; then
            echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate deploy metadata
        run: node --experimental-strip-types scripts/generate-deploy-metadata.ts
        env:
          DEPLOY_METADATA_DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
          DEPLOY_METADATA_BEFORE_SHA: ${{ github.event.before || '' }}
          DEPLOY_METADATA_SHA: ${{ github.sha }}
          DEPLOY_METADATA_BRANCH: ${{ github.ref_name }}
          DEPLOY_METADATA_OUTPUT: ${{ env.DEPLOY_METADATA_FILE }}

      - name: Install deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      - name: Deploy and verify rollout
        run: bash .github/deploy.sh

      - name: Remove cluster credentials
        if: always()
        run: |
          rm -f "$KUBECONFIG"
          rm -f "$HOME/.ssh/k3s-deploy"
