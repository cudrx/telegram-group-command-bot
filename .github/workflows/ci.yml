name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    outputs:
      bot-image:
        value: ${{ jobs.verify.outputs.bot-image }}
      video-image:
        value: ${{ jobs.verify.outputs.video-image }}
      gallery-image:
        value: ${{ jobs.verify.outputs.gallery-image }}
  push:
    branches-ignore: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
    outputs:
      bot-image: ${{ steps.refs.outputs.bot-image }}
      video-image: ${{ steps.refs.outputs.video-image }}
      gallery-image: ${{ steps.refs.outputs.gallery-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify code
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image names
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/telegram-group-command-bot"
          {
            echo "IMAGE_PREFIX=$prefix"
            echo "BOT_IMAGE=$prefix:$GITHUB_SHA"
            echo "VIDEO_IMAGE=$prefix-video:$GITHUB_SHA"
            echo "GALLERY_IMAGE=$prefix-gallery:$GITHUB_SHA"
          } >> "$GITHUB_ENV"

      - name: Build images
        uses: docker/bake-action@v6
        with:
          source: .
          files: .github/docker-bake.hcl
          load: true
          set: '*.platform=linux/amd64'

      - name: Smoke test images
        run: bash .github/smoke.sh

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images
        if: inputs.publish
        run: |
          for image in "$BOT_IMAGE" "$VIDEO_IMAGE" "$GALLERY_IMAGE"; do
            docker push "$image"
          done

      - name: Select published digests
        if: inputs.publish
        id: refs
        run: node .github/image-refs.mjs
