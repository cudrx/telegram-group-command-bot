name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    outputs:
      bot-image:
        value: ${{ jobs.verify.outputs.bot-image }}
      video-image:
        value: ${{ jobs.verify.outputs.video-image }}
      gallery-image:
        value: ${{ jobs.verify.outputs.gallery-image }}
  push:
    branches-ignore: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      bot-image: ${{ steps.refs.outputs.bot-image }}
      video-image: ${{ steps.refs.outputs.video-image }}
      gallery-image: ${{ steps.refs.outputs.gallery-image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify code
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/telegram-group-command-bot" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        id: build
        uses: docker/bake-action@v6
        with:
          source: .
          files: .github/docker-bake.hcl
          push: ${{ inputs.publish || false }}
          load: ${{ !inputs.publish }}
        env:
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Select exact image references
        id: refs
        run: node .github/image-refs.mjs
        env:
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
          PUBLISH: ${{ inputs.publish || false }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}

      - name: Smoke test images
        env:
          BOT_IMAGE: ${{ steps.refs.outputs.bot-image }}
          VIDEO_IMAGE: ${{ steps.refs.outputs.video-image }}
          GALLERY_IMAGE: ${{ steps.refs.outputs.gallery-image }}
        run: bash .github/smoke.sh
