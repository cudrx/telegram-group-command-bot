variables:
  NODE_VERSION: '22'
  DOCKER_VERSION: '29'

stages:
  - pre-build
  - build
  - release

lint:
  stage: pre-build
  image: node:${NODE_VERSION}-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  before_script:
    - npm ci
  script:
    - npm run lint
  after_script:
    - echo "Lint finished"

build-docker-dev:
  stage: build
  image: docker:${DOCKER_VERSION}-cli
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
  before_script:
    - docker version
  script:
    - VERSION=$CI_COMMIT_SHORT_SHA docker buildx bake dev --push
  after_script:
    - echo "Docker build finished"

build-docker-prod:
  stage: build
  image: docker:${DOCKER_VERSION}-cli
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - |
      if git merge-base --is-ancestor $CI_COMMIT_SHA origin/master; then
        echo "Success: The tag $CI_COMMIT_TAG belongs to the master branch history."
      else
        echo "Error: The tag $CI_COMMIT_TAG does not belong to the master branch."
        exit 1
      fi
  script:
    - VERSION=$CI_COMMIT_TAG docker buildx bake prod --push
  after_script:
    - echo "Docker build finished"
