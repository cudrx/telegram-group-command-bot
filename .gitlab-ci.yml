variables:
  NODE_VERSION: '22'
  DOCKER_VERSION: '29'
  GLAB_VERSION: 'v1.58.0'
  REGISTRY: 'registry.gitlab.com/cudrx'
  IMAGE_NAME: 'telegram-group-command-bot'

workflow:
  rules:
    - if: '$CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - pre-build
  - build
  - release

lint:
  stage: pre-build
  image: node:${NODE_VERSION}-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  before_script:
    - npm ci
  script:
    - npm run lint
  after_script:
    - echo "Lint finished"

build-docker-dev:
  stage: build
  image: docker:${DOCKER_VERSION}-cli
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
  before_script:
    - docker version
  script:
    - VERSION=$CI_COMMIT_SHORT_SHA docker buildx bake dev --push
  after_script:
    - echo "Docker dev build finished"

build-docker-prod:
  stage: build
  image: docker:${DOCKER_VERSION}-cli
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - |
      if git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"; then
        echo "Success: The tag $CI_COMMIT_TAG belongs to the $CI_DEFAULT_BRANCH branch history."
      else
        echo "Error: The tag $CI_COMMIT_TAG does not belong to the $CI_DEFAULT_BRANCH branch."
        exit 1
      fi
  script:
    - VERSION=$CI_COMMIT_TAG docker buildx bake prod --push
  after_script:
    - echo "Docker prod build finished"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:${GLAB_VERSION}
  needs:
    - build-docker-prod
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - glab --version
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  after_script:
    - echo "Release finished"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Docker image $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-prod'
          url: '$CI_PROJECT_URL/container_registry'
          link_type: image
