variables:
  NODE_VERSION: '24'
  DOCKER_VERSION: '29'
  BUILDKIT_VERSION: 'v0.26.0'
  GLAB_VERSION: 'v1.58.0'
  REGISTRY: 'registry.gitlab.com/cudrx'
  IMAGE_NAME: 'telegram-group-command-bot'
  FF_NETWORK_PER_BUILD: 'true'

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

stages:
  - pre-build
  - build
  - release

lint:
  stage: pre-build
  image: node:${NODE_VERSION}-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push"'
  before_script:
    - npm ci --ignore-scripts
  script:
    - npm run lint

.docker-build:
  stage: build
  image: docker:${DOCKER_VERSION}-cli
  services:
    - name: moby/buildkit:${BUILDKIT_VERSION}-rootless
      alias: buildkit
      command: ['--addr', 'tcp://0.0.0.0:1234']
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --name ci-rootless --driver remote tcp://buildkit:1234

build-docker-dev:
  extends: .docker-build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
  script:
    - VERSION="$CI_COMMIT_SHORT_SHA" docker buildx bake --builder ci-rootless -f docker/docker-bake.hcl dev --push

build-docker-prod:
  extends: .docker-build
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - |
      git fetch origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"; then
        echo "Error: The tag $CI_COMMIT_TAG does not belong to the $CI_DEFAULT_BRANCH branch." >&2
        exit 1
      fi
    - !reference [.docker-build, before_script]
  script:
    - VERSION="$CI_COMMIT_TAG" docker buildx bake --builder ci-rootless -f docker/docker-bake.hcl prod --push

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:${GLAB_VERSION}
  needs:
    - build-docker-prod
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - ':'
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Docker image $REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG-prod-amd64'
          url: '$CI_PROJECT_URL/container_registry'
          link_type: image
        - name: 'Docker image $REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG-prod-arm64'
          url: '$CI_PROJECT_URL/container_registry'
          link_type: image
