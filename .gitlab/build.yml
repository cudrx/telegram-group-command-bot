.docker-build:
  stage: build
  image: docker:${DOCKER_VERSION}-cli
  services:
    - name: moby/buildkit:${BUILDKIT_VERSION}-rootless
      alias: buildkit
      command: ['--addr', 'tcp://0.0.0.0:1234']
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --name ci-rootless --driver remote tcp://buildkit:1234
  script:
    - VERSION="$BUILD_VERSION" docker buildx bake --builder ci-rootless -f .gitlab/docker-bake.hcl "$BUILD_TARGET" --push

build-docker-dev:
  extends: .docker-build
  variables:
    BUILD_TARGET: 'dev'
    BUILD_VERSION: '$CI_COMMIT_SHORT_SHA'
  rules: !reference [.rules-dev, rules]

build-docker-prod:
  extends: .docker-build
  variables:
    BUILD_TARGET: 'prod'
    BUILD_VERSION: '$CI_COMMIT_TAG'
    GIT_DEPTH: '0'
  rules: !reference [.rules-prod, rules]
  before_script:
    - |
      git fetch origin "+refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "origin/$CI_DEFAULT_BRANCH"; then
        echo "Error: The tag $CI_COMMIT_TAG does not belong to the $CI_DEFAULT_BRANCH branch." >&2
        exit 1
      fi
    - !reference [.docker-build, before_script]
